server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: novamarket-backend

  profiles:
    active: dev

---
# ----------------------------------------------------
# PROFIL DEVELOPPEMENT : H2 en mémoire (démarrage instantané sans config)
# ----------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:novamarket_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

---
# ----------------------------------------------------
# PROFIL PRODUCTION : PostgreSQL (Docker / Serveur distant)
# ----------------------------------------------------
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:novamarket_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:novamarket}
    password: ${DB_PASSWORD:novamarket_secure_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false